[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sysdiag"
version = "1.0.0"
description = "System Diagnostics and Health Reporting Toolkit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
sysdiag = "sysdiag.cli:main"

[tool.setuptools.packages.find]
include = ["sysdiag*"]
